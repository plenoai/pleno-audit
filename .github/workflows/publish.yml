name: Publish

# Trusted publishing only runs for commits that have landed on main so
# branch protections and required CI checks cannot be bypassed with a tag.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter libztbs build

      - name: Publish packages to npm
        working-directory: packages/core
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "libztbs@${PKG_VERSION}" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "libztbs@${PKG_VERSION} is already published, skipping."
            exit 0
          fi
          npx -y npm@11 publish --access public --provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
