name: Release

on:
  push:
    branches:
      - main

# Serialize releases on main so concurrent pushes don't race on tag creation.
# Never cancel an in-progress release (it signs artifacts and cuts releases).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libztbs
        run: pnpm --filter libztbs build

      - name: Prepare WXT types
        run: pnpm --filter @pleno-audit/audit-extension exec wxt prepare

      - name: Build extensions
        run: |
          pnpm --filter @libztbs/battacker build
          pnpm build
          pnpm -C app/audit-extension build:firefox
          pnpm -C app/battacker-extension build
          pnpm -C app/battacker-extension build:firefox

      - name: Check for untracked files
        run: |
          UNTRACKED=$(git status --porcelain | grep '^??' || true)
          if [ -n "$UNTRACKED" ]; then
            echo "ERROR: Untracked files detected:"
            echo "$UNTRACKED"
            exit 1
          fi

      - name: Create zip artifacts
        run: |
          set -e
          # Chrome MV3
          cd app/audit-extension/dist/chrome-mv3
          zip -r ../../../../pleno-audit-chrome.zip .
          # Firefox MV2
          cd ../firefox-mv2
          zip -r ../../../../pleno-audit-firefox.zip .
          # Battacker Chrome
          cd ../../../../app/battacker-extension/dist/chrome-mv3
          zip -r ../../../../pleno-battacker-chrome.zip .
          # Battacker Firefox
          cd ../firefox-mv2
          zip -r ../../../../pleno-battacker-firefox.zip .

      - name: Generate checksums
        run: |
          set -e
          sha256sum pleno-audit-chrome.zip pleno-audit-firefox.zip pleno-battacker-chrome.zip pleno-battacker-firefox.zip > checksums.txt

      - name: Generate attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.1.0
        with:
          subject-path: |
            pleno-audit-chrome.zip
            pleno-audit-firefox.zip
            pleno-battacker-chrome.zip
            pleno-battacker-firefox.zip

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts with Sigstore
        run: |
          set -e
          for file in pleno-audit-chrome.zip pleno-audit-firefox.zip pleno-battacker-chrome.zip pleno-battacker-firefox.zip checksums.txt; do
            cosign sign-blob "$file" --yes --bundle "${file}.sigstore.json"
          done

      - name: Get version
        id: version
        run: |
          set -e
          VERSION=$(node -p "require('./app/audit-extension/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: canary
          name: "Canary (${{ steps.version.outputs.version }})"
          prerelease: true
          make_latest: false
          files: |
            pleno-audit-chrome.zip
            pleno-audit-chrome.zip.sigstore.json
            pleno-audit-firefox.zip
            pleno-audit-firefox.zip.sigstore.json
            pleno-battacker-chrome.zip
            pleno-battacker-chrome.zip.sigstore.json
            pleno-battacker-firefox.zip
            pleno-battacker-firefox.zip.sigstore.json
            checksums.txt
            checksums.txt.sigstore.json
          generate_release_notes: true
