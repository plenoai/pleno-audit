name: Post-merge self-heal
on:
  workflow_run:
    workflows: ["CI", "CodeQL", "Deploy Website to GitHub Pages", "Release", "Scorecard supply-chain security", "sisakulint"]
    branches: [main]
    types: [completed]
permissions: {}
jobs:
  heal:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: HikaruEgashira/gh-verify/.github/workflows/post-merge-heal.yml@534d0df958815b3f73e8b389bf216b83e5828365
    with:
      automation_ref: 534d0df958815b3f73e8b389bf216b83e5828365
      check_workflows: '["ci.yml"]'
      post_merge_workflows: '["ci.yml","codeql.yml","deploy-website.yml","release.yml","scorecard.yml","sisakulint.yml"]'
